[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-gateway-cutover"
version = "0.1.0"
description = "A typed payment-risk service migrating the OpenAI Python client to Infrai."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<3",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
